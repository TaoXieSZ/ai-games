<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-games · AI 打造的游戏合集</title>
    <style>
      :root {
        --bg: #1a1c2c;
        --panel: #29366f;
        --ink: #f4f4f4;
        --dim: #94b0c2;
        --gold: #ffcd75;
        --hot: #ef7d57;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace;
        line-height: 1.7;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
      }
      main { max-width: 620px; padding: 32px 20px; width: 100%; }
      h1 {
        font-size: clamp(36px, 8vw, 56px);
        letter-spacing: .1em;
        color: var(--gold);
        text-shadow: 4px 4px 0 var(--hot), 8px 8px 0 rgba(0,0,0,.4);
        margin: 0 0 8px;
      }
      .sub { color: var(--dim); letter-spacing: .2em; margin-bottom: 28px; }
      a.card {
        display: block;
        text-decoration: none;
        color: var(--ink);
        background: var(--panel);
        border: 4px solid var(--ink);
        box-shadow: 8px 8px 0 rgba(0,0,0,.4);
        padding: 18px 20px;
        margin-bottom: 16px;
        transition: transform .05s steps(2);
      }
      a.card:hover { transform: translate(-2px, -2px); }
      .title { font-size: 20px; color: var(--gold); }
      .desc { font-size: 14px; color: var(--dim); margin-top: 6px; }
      footer { color: var(--dim); font-size: 12px; margin-top: 24px; }
      footer a { color: var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <h1>AI GAMES</h1>
      <div class="sub">AI 打造的游戏实验合集</div>
      <a class="card" href="./hype-life/">
        <div class="title">🔥 热搜人生 · Hype Life</div>
        <div class="desc">
          像素风叙事抉择模拟器——从高三三本线到纳斯达克敲钟，再到 2026
          年的恋情热搜连续剧。纯属虚构讽刺作品，人物事件均为艺术加工。
        </div>
      </a>
      <footer>
        <a href="https://github.com/TaoXieSZ/ai-games">GitHub 仓库</a> ·
        由 AI (ZCode) 全程开发 · 每次推送自动构建部署
      </footer>
    </main>
  </body>
</html>
