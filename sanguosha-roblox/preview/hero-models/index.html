<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roblox 三国杀 · 武将3D模型检视</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Roblox 三国杀美术设定</p>
          <h1>全武将3D模型</h1>
          <p id="modelSummary" class="subtitle">读取骨架模型中</p>
        </div>
        <nav class="page-links" aria-label="图鉴导航">
          <a href="../hero-pool/">武将图鉴</a>
          <a href="../game-cards/">游戏牌图鉴</a>
          <a href="../battle-ui/">对局 UI 试演</a>
          <a href="../../../">图鉴首页</a>
        </nav>
      </header>

      <section class="viewer-shell" aria-label="武将3D模型检视器">
        <div class="stage-wrap">
          <canvas id="stage" aria-label="可拖动旋转、滚轮缩放的武将3D模型"></canvas>
          <div id="skillCue" class="skill-cue" hidden aria-hidden="true"><span class="cue-rays"></span><span class="cue-seal"></span><span class="cue-icon"></span><strong class="cue-name"></strong><span class="cue-rule"></span></div>
          <div class="stage-badges">
            <output id="modelStats">几何 0 · 骨骼 0</output>
            <output id="cameraHint">拖动旋转 · 滚轮缩放</output>
          </div>
        </div>

        <aside class="control-panel">
          <section class="panel-block">
            <p class="panel-kicker">武将</p>
            <div id="heroTabs" class="hero-list" role="tablist" aria-label="选择武将"></div>
            <article class="model-notes" aria-label="当前武将设计说明">
              <h2 id="heroName">武将</h2>
              <p id="designNotes">读取设计说明中</p>
              <dl>
                <div>
                  <dt>势力</dt>
                  <dd id="factionLabel">-</dd>
                </div>
                <div>
                  <dt>动作差异</dt>
                  <dd id="poseNotes">-</dd>
                </div>
              </dl>
            </article>
          </section>

          <section class="panel-block">
            <p class="panel-kicker">视角</p>
            <div class="segmented" aria-label="选择视角">
              <button type="button" data-view="front" aria-pressed="false">前</button>
              <button type="button" data-view="side" aria-pressed="false">侧</button>
              <button type="button" data-view="back" aria-pressed="false">后</button>
            </div>
          </section>

          <section class="panel-block">
            <p class="panel-kicker">动作</p>
            <div class="segmented stacked" aria-label="动作预览">
              <button type="button" data-action="ready" aria-pressed="true">待机</button>
              <button type="button" data-action="walk" aria-pressed="false">行走</button>
              <button type="button" data-action="attack" aria-pressed="false">攻击</button>
            </div>
            <div class="effect-panel" aria-label="技能特效试播">
              <p class="effect-title">技能特效试播</p>
              <div id="effectCategories" class="segmented" aria-label="特效牌类">
                <button type="button" data-category="basic" aria-pressed="false">基本牌</button>
                <button type="button" data-category="trick" aria-pressed="true">锦囊牌</button>
                <button type="button" data-category="equipment" aria-pressed="false">装备牌</button>
              </div>
              <div id="equipmentModes" class="segmented" aria-label="装备预览方式" hidden>
                <button type="button" data-mode="equip" aria-pressed="true">装备入场</button>
                <button type="button" data-mode="trigger" aria-pressed="false">效果触发</button>
              </div>
              <div id="effectButtons" class="effect-grid"></div>
              <p id="effectDescription" class="effect-description">选择一张牌，查看它的表现。</p>
              <div class="effect-status-row">
                <output id="effectStage">选择技能预览特效</output>
                <button id="effectCancel" type="button">清理</button>
              </div>
              <p class="effect-note">地面圈只表示特效演示目标，不代表真实距离规则。</p>
            </div>
          </section>

          <section class="panel-block reference-block">
            <label class="toggle-row">
              <input id="referenceToggle" type="checkbox" checked />
              <span>显示原画参考</span>
            </label>
            <figure id="referenceCard" class="reference-card"></figure>
          </section>

          <section class="panel-block">
            <p class="panel-kicker">模型文件</p>
            <div class="download-grid">
              <a id="glbLink" href="#" download>GLB</a>
              <a id="rbxmxLink" href="#" download>RBXMX</a>
              <a id="playgroundLink" class="wide-download" href="../../models/hero-models-v1/hero-playground.rbxlx" download>Roblox试演场</a>
            </div>
            <p id="fileStatus" class="file-status" role="status" aria-live="polite">检查下载文件中</p>
            <p class="file-status">Roblox可Play试演场用于在Studio里试跑全武将模型与动作。</p>
          </section>
        </aside>
      </section>

      <section id="status" class="status" role="status" aria-live="polite"></section>
    </main>

    <script src="./card-effects.js" defer></script>
    <script src="./main.js" defer></script>
  </body>
</html>
